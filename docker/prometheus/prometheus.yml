global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: margit
    metrics_path: /metrics
    static_configs:
      - targets: ["margit:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
