name: margit

services:
  margit:
    build: .
    image: margit:latest
    ports:
      - "8080:8080"
    environment:
      MARGIT_LOG_LEVEL: info
      MARGIT_STORE_TYPE: postgres
      MARGIT_PG_DSN: postgres://margit:margit@postgres:5432/margit?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: margit
      POSTGRES_PASSWORD: margit
      POSTGRES_DB: margit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margit -d margit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - margit
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/margit.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  k6:
    image: grafana/k6:2.3.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://margit:8080
    volumes:
      - ./loadtest:/scripts:ro
    command: ["run", "/scripts/margit.js"]
    depends_on:
      margit:
        condition: service_healthy

volumes:
  pgdata:
  promdata:
  grafanadata:
