name: margit

services:
  margit:
    build: .
    image: margit:latest
    ports:
      - "8080:8080"
    environment:
      MARGIT_LOG_LEVEL: info
      MARGIT_STORE_TYPE: postgres
      MARGIT_MAX_DEPTH: ${MARGIT_MAX_DEPTH:-64}
      MARGIT_BLOOM_EXPECTED: ${MARGIT_BLOOM_EXPECTED:-12000000}
      MARGIT_PG_DSN: postgres://margit:margit@postgres:5432/margit?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-64MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-256MB}
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_wal_size=4GB
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
    environment:
      POSTGRES_USER: margit
      POSTGRES_PASSWORD: margit
      POSTGRES_DB: margit
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: ${PG_MEM_LIMIT:-384m}
    memswap_limit: ${PG_MEM_LIMIT:-384m}
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margit -d margit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    command:
      - --no-collector.stat_statements
      - --extend.query-path=/etc/postgres-exporter/queries.yml
    volumes:
      - ./docker/postgres/exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
    environment:
      DATA_SOURCE_URI: postgres:5432/margit?sslmode=disable
      DATA_SOURCE_USER: margit
      DATA_SOURCE_PASS: margit
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - margit
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/margit.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  k6:
    image: grafana/k6:2.3.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://margit:8080
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/results:/results
    command: ["run", "/scripts/margit.js"]
    depends_on:
      margit:
        condition: service_healthy

volumes:
  pgdata:
  promdata:
  grafanadata:
